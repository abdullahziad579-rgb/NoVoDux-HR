.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}

h1{margin:0;font-size:22px}

table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{font-size:14px;padding:10px 12px;border-bottom:1px solid var(--row);text-align:start;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ok-bg);color:var(--ok-ink)}
.chip.off{background:var(--off-bg);color:var(--off-ink)}
.chip.err{background:var(--err-bg);color:var(--err-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.box{border-radius:10px;padding:12px 16px}
.box.ok{background:var(--accent-soft);border:1px solid var(--accent-soft-bd);color:var(--accent-soft-ink)}
.box.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink)}
.box.err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-ink)}

.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.layout{display:flex;flex-wrap:wrap;min-height:calc(100vh - 62px)}

.nav-btn{font:inherit;font-size:15px;text-align:start;min-height:44px;padding:10px 14px;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700}
.nav-btn:disabled{color:var(--muted);cursor:default}
main{flex:999 1 560px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:18px}

.login{width:100%;max-width:400px}

function parseDate(v) {

  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); if (d) return { ok: true, v: d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0') }; }
  const s = String(v).trim().replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { ok: true, v: m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') };
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if (m) return { ok: true, v: m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') };
  return { ok: false };

      const du = sel([['', '—'], ...Object.entries(unitL)], d.unit || '', { 'aria-label': t('sUnitOverride'), style: 'max-width:130px' }); const da = h('input', { type: 'checkbox', checked: d.is_active, 'aria-label': t('active') });
      return { d, tr: h('tr', null, h('td', null, dn), h('td', null, de), h('td', null, dv), h('td', null, du), h('td', null, da)), get: () => ({ name: dn.value.trim(), name_en: nn(de.value.trim()), default_value: Number(dv.value) || 0, unit: nn(du.value), is_active: da.checked }) };
    });
    const nd = { n: inp({ 'aria-label': t('sNameAr') }), e: inp({ dir: 'ltr', 'aria-label': t('sNameEn') }), v: inp({ type: 'number', step: '0.5', value: 0, style: 'max-width:110px', 'aria-label': t('sDefault') }) };
    editor.replaceChildren(h('div', { class: 'card', style: 'border-color:var(--accent);display:flex;flex-direction:column;gap:14px' },
      h('div', { class: 'between' }, h('h2', { style: 'margin:0' }, ty ? t('sEdit') + ': ' + nm(ty) : t('sAddType')), h('button', { class: 'btn2 sm', type: 'button', onClick: () => editor.replaceChildren() }, t('cancel'))),
      h('div', { class: 'grid' }, field(t('sNameAr'), E.name, { req: true }), field(t('sNameEn'), E.name_en), field(t('cat'), E.category), field(t('unit'), E.unit), field(t('attach'), E.attachment), field(t('balance'), E.balance_type), field(t('countWin'), E.count_window), field(t('sort'), E.sort)),
      h('div', { class: 'row' }, h('label', { class: 'check' }, C.needs_time, t('needsTime')), h('label', { class: 'check' }, C.needs_range, t('needsRange')), h('label', { class: 'check' }, C.count_repeats, t('countRep')), h('label', { class: 'check' }, C.is_active, t('active'))),
      ty ? h('div', null, h('h2', null, t('sDetails')), h('div', { class: 'scroll' }, h('table', null, h('thead', null, h('tr', null, h('th', null, t('sNameAr')), h('th', null, t('sNameEn')), h('th', null, t('sDefault')), h('th', null, t('sUnitOverride')), h('th', null, t('active')))),
        h('tbody', null, detRows.map((r) => r.tr), h('tr', null, h('td', null, nd.n), h('td', null, nd.e), h('td', null, nd.v), h('td', { colspan: '2' }, h('button', { class: 'btn2 sm', type: 'button', onClick: () => { if (!nd.n.value.trim()) return; origRun(sb.from('event_details').insert({ event_type_id: ty.id, name: nd.n.value.trim(), name_en: nn(nd.e.value.trim()), default_value: Number(nd.v.value) || 0, sort: dets.length + 1 })); } }, t('sAddDetail')))))))) : null,
      h('div', null, h('button', { class: 'btn', type: 'button', onClick: async (ev) => {
        if (!E.name.value.trim()) { toast(t('fieldsMissing'), 'err'); return; }
        ev.target.disabled = true;
        const row = { name: E.name.value.trim(), name_en: nn(E.name_en.value.trim()), category: E.category.value, unit: E.unit.value, attachment: E.attachment.value, balance_type: nn(E.balance_type.value), count_window: E.count_window.value, sort: Number(E.sort.value) || 0,
          needs_time: C.needs_time.checked, needs_range: C.needs_range.checked, count_repeats: C.count_repeats.checked, is_active: C.is_active.checked };
        try {
          if (ty) { await q(sb.from('event_types').update(row).eq('id', ty.id)); for (const r of detRows) { const v = r.get(); await q(sb.from('event_details').update(v).eq('id', r.d.id)); } }

  };
  wrap.append(h('div', { class: 'card', style: 'padding:0' },
    h('div', { class: 'between', style: 'padding:20px 20px 0' }, h('h2', { style: 'margin:0' }, t('sTypes')), h('button', { class: 'btn2', type: 'button', onClick: () => openEditor(null) }, t('sAddType'))),

      h('tbody', null, types.map((ty) => h('tr', null, h('td', { style: 'font-weight:600' }, ty.name), h('td', null, ty.name_en || '—'), h('td', null, catL[ty.category]), h('td', null, unitL[ty.unit]),
        h('td', { class: 'muted' }, details.filter((d) => d.event_type_id === ty.id).map((d) => nm(d) + ' (' + Number(d.default_value) + ')').join(' · ')),

  // الإعدادات العامة
  const sv = (k) => { const r = settings.find((s) => s.key === k); return r && r.value != null ? r.value : ''; };
  const G = { annual_leave_days: t('gAnnual'), casual_leave_days: t('gCasual'), leave_eligibility_months: t('gElig'), annual_monthly_cap: t('gCap'), attachments_keep_years: t('gKeep') };
  const GI = {}; Object.keys(G).forEach((k) => (GI[k] = inp({ type: 'number', min: '0', step: '0.5', value: sv(k) })));

}

/* ====================== حسابي ====================== */
async function viewAccount() {
  const p1 = inp({ type: 'password', autocomplete: 'new-password' }), p2 = inp({ type: 'password', autocomplete: 'new-password' });
  return h('div', { style: 'display:flex;flex-direction:column;gap:16px;max-width:520px' }, h('h1', null, t('aTitle')),
    h('div', { class: 'card', style: 'display:flex;flex-direction:column;gap:12px' },
      h('div', null, h('div', { style: 'font-weight:700' }, S.profile.full_name), h('div', { class: 'muted', dir: 'ltr', style: 'text-align:start' }, S.session.user.email)),
      field(t('aNewPass'), p1), field(t('aNewPass2'), p2),
      h('div', null, h('button', { class: 'btn', type: 'button', onClick: async (ev) => {
        if (p1.value.length < 8) { toast(t('aShort'), 'err'); return; }
        if (p1.value !== p2.value) { toast(t('aMismatch'), 'err'); return; }
        ev.target.disabled = true; const r = await sb.auth.updateUser({ password: p1.value }); ev.target.disabled = false;
        if (r.error) fail(r.error); else { toast(t('aChanged')); p1.value = p2.value = ''; }
      } }, t('aChange')))));
}

/* ====================== التشغيل ====================== */
(async () => {
  applyChrome();
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) await boot(); else render();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { S.session = null; S.profile = null; render(); } else if (session) S.session = session; });
})();
</script>
