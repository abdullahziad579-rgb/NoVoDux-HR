.scroll{overflow-x:auto}

function parseDate(v) {
  if (v == null || v === '') return { ok: true, v: null };
  if (v instanceof Date && !isNaN(v)) return { ok: true, v: v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0') };
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); if (d) return { ok: true, v: d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0') }; }
  const s = String(v).trim().replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { ok: true, v: m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') };
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if (m) return { ok: true, v: m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') };
  return { ok: false };
}

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    let blob = null;
    for (let round = 0; round < 4; round++) {
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      for (const qv of [0.78, 0.62, 0.48]) {
        blob = await new Promise((r) => c.toBlob(r, 'image/webp', qv));
        if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', qv));
        if (blob.size <= 180000) return blob;
      }
      scale *= 0.7;
    }
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

async function refreshProfile() {
  try {
    const id = S.profile.id;
    const p = await q(sb.from('profiles').select('*').eq('id', id).maybeSingle());
    if (!S.profile || S.profile.id !== id) return true;
    if (!p || !p.is_active) { await sb.auth.signOut(); S.session = null; S.profile = null; return false; }

}

      if (can('edit_leave')) {
        const a = inp({ type: 'number', min: '0', step: '0.5', value: n(b.annual_ent), 'aria-label': t('balTotal'), style: 'max-width:120px' });
        const c = inp({ type: 'number', min: '0', step: '0.5', value: n(b.casual_ent), 'aria-label': t('balCasualIn'), style: 'max-width:120px' });
        const save = async (btn) => {
          if (a.value === '' || c.value === '' || Number(a.value) < 0 || Number(c.value) < 0) { toast(t('fieldsMissing'), 'err'); return; }
          btn.disabled = true;
          try { await q(sb.from('leave_entitlements').upsert([{ employee_id: empId, year: yr, balance_type: 'annual', days: Number(a.value) }, { employee_id: empId, year: yr, balance_type: 'casual', days: Number(c.value) }])); toast(t('saved')); load(); }
          catch (ex) { fail(ex); btn.disabled = false; }
        };
        const reset = async () => { try { await q(sb.from('leave_entitlements').delete().eq('employee_id', empId).eq('year', yr)); toast(t('saved')); load(); } catch (ex) { fail(ex); } };
        parts.push(h('div', { class: 'row', style: 'align-items:end;border-top:1px solid var(--row);padding-top:12px' },
          h('div', null, h('span', { class: 'lbl' }, t('balTotal')), a), h('div', null, h('span', { class: 'lbl' }, t('balCasualIn')), c),
          h('button', { class: 'btn sm', type: 'button', onClick: (ev) => save(ev.currentTarget) }, t('balEdit')),
          (b.annual_override || b.casual_override) ? h('button', { class: 'btn2 sm', type: 'button', onClick: reset }, t('balReset')) : null));
      }
      body.replaceChildren(...parts);
    } catch (ex) { body.replaceChildren(h('div', { class: 'box err' }, t('errGeneric') + ex.message)); }
  };
  yearSel.addEventListener('change', load); load();
  return h('div', { class: 'card' }, h('div', { class: 'between', style: 'margin-bottom:12px' }, h('h2', { style: 'margin:0' }, t('balTitle')), yearSel), body);
}

/* ---------- التقرير اليومي ---------- */
function dailyReport() {
  const f = S.cache.daily || (S.cache.daily = { month: today().slice(0, 7), branch: isAdmin() ? '' : String(S.profile.branch_id), status: '', type: '', emp: '' });
  if (!isAdmin()) f.branch = String(S.profile.branch_id);
  const monthInp = inp({ type: 'month', value: f.month, 'aria-label': t('repMonth') });
  const brSel = isAdmin() ? sel([['', t('allBranches')], ...S.branches.map((b) => [b.id, bName(b)])], f.branch, { 'aria-label': t('repBranch') }) : null;
  const stSel = sel([['', t('allStatuses')], ['approved', t('fsApproved')], ['pending', t('fsPending')], ['clarify', t('fsClarify')], ['rejected', t('fsRejected')]], f.status, { 'aria-label': t('cStatus') });
  const tySel = h('select', { class: 'inp', 'aria-label': t('cEvent') });
  const empSel = h('select', { class: 'inp', 'aria-label': t('fEmployee') });
  const box = h('div', { style: 'display:flex;flex-direction:column;gap:12px' });
  let rows = [], types = [], emps = [];
  const stName = (s) => ({ pending: t('fsPending'), clarify: t('fsClarify'), approved: t('fsApproved'), rejected: t('fsRejected') })[s];
  const tyName = (r) => (L() ? r.event_type_name_en || r.event_type_name : r.event_type_name);
  const dtName = (r) => (L() ? r.detail_name_en || r.detail_name : r.detail_name) || '';
  const brN = (r) => (L() ? r.branch_name_en || r.branch_name : r.branch_name);
  const timeTxt = (r) => (r.time_from ? tm(r.time_from) + ' - ' + tm(r.time_to) : '');
  const finTxt = (r) => (r.status === 'approved' && r.final != null ? Number(r.final) : '');
  const days = () => { const m = new Map(); rows.forEach((r) => { if (!m.has(r.date_from)) m.set(r.date_from, []); m.get(r.date_from).push(r); }); return [...m.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)); };
  const fillSelects = () => {
    const tyKeep = f.type, emKeep = f.emp;
    tySel.replaceChildren(h('option', { value: '' }, t('allTypes')), ...types.map((x) => h('option', { value: x.id, selected: String(x.id) === tyKeep }, nm(x))));
    const list = emps.filter((e) => !f.branch || String(e.primary_branch_id) === f.branch).sort((a, b) => cmpCode(a.code, b.code));
    empSel.replaceChildren(h('option', { value: '' }, t('allEmps2')), ...list.map((e) => h('option', { value: e.id, selected: String(e.id) === emKeep }, e.code + ' - ' + e.full_name)));
  };
  const draw = () => {
    if (!rows.length) { box.replaceChildren(h('div', { class: 'card muted' }, t('dailyEmpty'))); return; }
    const showBr = isAdmin() && !f.branch;
    const cols = 11 + (showBr ? 1 : 0);
    const body = [];
    days().forEach(([d, list]) => {
      body.push(h('tr', { class: 'grp' }, h('td', { colspan: String(cols) }, dayName(wday(d)) + ' ' + fmtDate(d) + ' — ' + t('dayEvents', { n: list.length }))));
      list.forEach((r) => body.push(h('tr', null, h('td', { style: 'white-space:nowrap' }, fmtDate(r.date_from) + (r.date_to !== r.date_from ? ' - ' + fmtDate(r.date_to) : '')), h('td', null, r.employee_code), h('td', { style: 'font-weight:600' }, r.employee_name),
        showBr ? h('td', null, brN(r)) : null, h('td', null, tyName(r)), h('td', null, dtName(r) || '—'), h('td', { dir: 'ltr', style: 'white-space:nowrap' }, timeTxt(r) || '—'),
        h('td', { class: 'num' }, r.suggested != null ? Number(r.suggested) : '—'), h('td', { class: 'num' }, finTxt(r) === '' ? '—' : finTxt(r)), h('td', null, unitName(r.unit)), h('td', null, statusChip(r.status)),
        h('td', { class: 'muted', style: 'max-width:240px' }, [r.manager_notes, r.review_note].filter(Boolean).join(' | ') || '—'))));
    });
    box.replaceChildren(h('div', { class: 'muted' }, t('count') + ': ' + rows.length),
      h('div', { class: 'card scroll', style: 'padding:0' }, h('table', { class: 'report', style: 'min-width:1100px' },
        h('thead', null, h('tr', null, h('th', null, t('cDate')), h('th', null, t('cCode')), h('th', null, t('cName')), showBr ? h('th', null, t('cBranch')) : null, h('th', null, t('cEvent')), h('th', null, t('fDetail')), h('th', null, t('cTime')),
          h('th', null, t('cSug')), h('th', null, t('cFinal')), h('th', null, t('unit')), h('th', null, t('cStatus')), h('th', null, t('cNotes')))),
        h('tbody', null, body))));
  };
  const load = async () => {
    f.month = monthInp.value; if (brSel) f.branch = brSel.value; f.status = stSel.value; f.type = tySel.value; f.emp = empSel.value;
    if (!f.month) return;
    box.replaceChildren(h('div', { class: 'muted' }, t('loading')));
    try {
      if (!types.length) [types, emps] = await Promise.all([q(sb.from('event_types').select('id,name,name_en').order('sort')), q(sb.from('employees').select('id,code,full_name,primary_branch_id'))]);
      fillSelects();
      let qq = sb.from('v_events').select('*').gte('date_from', monthStart(f.month)).lt('date_from', monthNext(f.month)).order('date_from').order('employee_code').order('id');
      if (f.branch) qq = qq.eq('branch_id', Number(f.branch));
      if (f.status) qq = qq.eq('status', f.status);
      if (f.type) qq = qq.eq('event_type_id', Number(f.type));
      if (f.emp) qq = qq.eq('employee_id', Number(f.emp));
      rows = await q(qq);
      rows.sort((a, b) => (a.date_from < b.date_from ? -1 : a.date_from > b.date_from ? 1 : cmpCode(a.employee_code, b.employee_code) || a.id - b.id));
      draw();
    } catch (ex) { box.replaceChildren(h('div', { class: 'box err' }, t('errGeneric') + ex.message)); }
  };
  const exportX = () => {
    const brName = f.branch ? bName(S.branches.find((b) => String(b.id) === f.branch)) : t('allBranches');
    const head = [[t('repTabDaily') + ' — ' + f.month], [t('repBranch') + ': ' + brName + (f.status ? ' · ' + stName(f.status) : '')], [t('repGen') + ': ' + nowStamp()], []];
    const hdr = [t('cDate'), t('cDay'), t('cCode'), t('cName'), t('cBranch'), t('cEvent'), t('fDetail'), t('cTime'), t('cSug'), t('cFinal'), t('unit'), t('cStatus'), t('cNotes')];
    const out = [];
    days().forEach(([d, list]) => {
      list.forEach((r) => out.push([fmtDate(r.date_from) + (r.date_to !== r.date_from ? ' - ' + fmtDate(r.date_to) : ''), dayName(wday(d)), r.employee_code, r.employee_name, brN(r), tyName(r), dtName(r), timeTxt(r),
        r.suggested != null ? Number(r.suggested) : '', finTxt(r), unitName(r.unit), stName(r.status), [r.manager_notes, r.review_note].filter(Boolean).join(' | ')]));
    });
    xlsxWrite([{ name: t('shDaily'), rows: head.concat([hdr], out), widths: [14, 10, 8, 24, 14, 22, 18, 13, 9, 11, 7, 13, 34] }],
      (L() ? 'daily-events_' : 'الأحداث-اليومية_') + f.month + '_' + (f.branch ? brName.replace(/[\[\]\s]+/g, '-') : (L() ? 'all-branches' : 'كل-الفروع')) + '.xlsx');
  };
  [monthInp, stSel, tySel, empSel].forEach((x) => x.addEventListener('change', load));
  if (brSel) brSel.addEventListener('change', () => { f.emp = ''; empSel.value = ''; load(); });
  load();
  return h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
    h('div', { class: 'between' }, h('div', { class: 'muted' }, t('dailySub')),
      h('div', { class: 'row no-print' }, h('button', { class: 'btn2', type: 'button', onClick: exportX }, t('repExcel')), h('button', { class: 'btn2', type: 'button', onClick: () => window.print() }, t('repPrint')))),
    h('div', { class: 'card no-print' }, h('div', { class: 'grid' }, field(t('repMonth'), monthInp), brSel ? field(t('repBranch'), brSel) : null, field(t('cStatus'), stSel), field(t('cEvent'), tySel), field(t('fEmployee'), empSel))),
    h('div', { class: 'print-only' }, h('h2', { style: 'margin:0' }, 'NoVoDux Academy — ' + t('repTabDaily') + ' ' + monthInp.value)),
    box);
}

/* ====================== التشغيل ====================== */
(async () => {
  applyChrome();
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) await boot(); else render();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { S.session = null; S.profile = null; render(); } else if (session) S.session = session; });
})();
</script>
